name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New advisories appear without any change to the code, so this run only
    # looks at the dependencies. Every other job skips it.
    - cron: "17 6 * * 1"

# Nothing here needs to change the repository or hold a secret.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.99.1"
  FLUTTER_VERSION: "3.47.9"
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: Rust on ${{ matrix.os }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked --features zerohop-core/dev-loopback,zerohop-app/dev-loopback

  dependencies:
    name: Advisories and licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
      - name: Check dependencies
        run: cargo deny check

  fuzz-targets:
    name: Fuzz targets compile
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install nightly --profile minimal
      - name: Check the targets
        working-directory: fuzz
        run: cargo +nightly check --locked

  interface:
    name: Interface
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Fetch packages
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Tests
        working-directory: app
        run: flutter test

  build:
    name: Build for ${{ matrix.name }}
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            targets: aarch64-apple-darwin x86_64-apple-darwin
            command: flutter build macos --release
          - name: Android
            os: ubuntu-latest
            targets: aarch64-linux-android armv7-linux-androideabi
            command: flutter build apk --release --target-platform android-arm,android-arm64
          - name: Windows
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            command: flutter build windows --release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add ${{ matrix.targets }}
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Use JDK 21
        if: matrix.name == 'Android'
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - name: Build
        working-directory: app
        run: ${{ matrix.command }}
      # The Windows build is kept for a week so it can be tried on a real
      # machine. It is unsigned and only for testing.
      - name: Add the C++ runtime to the Windows build
        if: matrix.name == 'Windows'
        run: cp /c/Windows/System32/{msvcp140,vcruntime140,vcruntime140_1}.dll app/build/windows/x64/runner/Release/
      - name: Keep the Windows build
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerohop-windows-test
          path: app/build/windows/x64/runner/Release/
          retention-days: 7
          if-no-files-found: error
      # The installer is unsigned until code signing is set up, so Windows
      # warns before running it.
      - name: Make the Windows installer
        if: matrix.name == 'Windows'
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $version = (Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" app/windows/installer/zerohop.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Keep the Windows installer
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zerohop-windows-setup
          path: app/build/windows/installer/*.exe
          retention-days: 7
          if-no-files-found: error
