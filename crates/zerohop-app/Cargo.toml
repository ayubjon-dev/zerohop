[package]
name = "zerohop-app"
description = "The application layer shared by every Zerohop interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets tests run over the loopback interface. Never enabled in release builds.
dev-loopback = ["zerohop-core/dev-loopback"]

[dependencies]
blake3 = "1.8"
data-encoding = "2.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
zeroize = "1.9"
zerohop-core = { path = "../zerohop-core" }

[dev-dependencies]
tempfile = "3.27"
