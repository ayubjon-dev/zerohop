[package]
name = "zerohop-ffi"
description = "C interface between the Zerohop core and the Flutter app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "zerohop_ffi"
crate-type = ["cdylib", "rlib"]

# The only crate allowed to use `unsafe`: the small functions at the C boundary,
# and on Windows the calls that protect the secret sealing the device key.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
zerohop-app = { path = "../zerohop-app" }
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.27"
