[package]
name = "zerohop-core"
description = "Core protocol and transfer engine for Zerohop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets tests and benchmarks run over the loopback interface. Never enabled in release builds.
dev-loopback = []

[dependencies]
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys"] }
blake3 = "1.8"
caseless = "0.2"
cap-std = "4.0"
data-encoding = "2.11"
ed25519-dalek = "3.0"
fs4 = "1.1"
getrandom = "0.4"
hkdf = "0.13"
hmac = "0.13"
if-addrs = "0.15"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde-big-array = "0.5"
sha2 = "0.11"
spake2 = "=0.4.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
unicode-normalization = "0.1"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.7"

[dev-dependencies]
proptest = "1.12"
tempfile = "3.27"
